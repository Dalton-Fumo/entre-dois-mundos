<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada — Uma Voz Entre Dois Mundos</title>
  <link rel="icon" href="/assets/favicon.png" sizes="512x512" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root { --wine:#470513; --gold:#e9c07a; --cream:#f8f3ec; --ink:#2a1a1f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 70% 30%, #5d1025 0%, rgba(93,16,37,0) 55%), var(--wine);
      color: var(--cream); font-family: "DM Sans", Arial, sans-serif;
      padding: 32px; text-align: center;
    }
    .box { max-width: 520px; }
    .mark { width: 150px; margin: 0 auto 28px; }
    .code {
      font-family: "Bodoni Moda", Didot, serif;
      font-size: 74px; line-height: 1; color: var(--gold); margin: 0 0 14px;
    }
    h1 {
      font-family: "Bodoni Moda", Didot, serif; font-weight: 400;
      font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.15; margin: 0 0 14px;
    }
    p { color: #ecd9d8; line-height: 1.7; margin: 0 0 26px; font-size: 15px; }
    a.btn {
      display: inline-block; border: 1px solid var(--gold); background: var(--gold);
      color: var(--wine); text-decoration: none; padding: 14px 26px;
      font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    }
    a.btn:hover { background: #f8d58f; }
  </style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/assets/logo-mark.png" alt="Uma Voz Entre Dois Mundos">
    <p class="code">404</p>
    <h1>Esta página atravessou a fronteira errada.</h1>
    <p>O endereço que procuras não existe ou foi movido. Volta ao início e continua a explorar.</p>
    <a class="btn" href="/">Voltar ao site</a>
  </div>
</body>
</html>
